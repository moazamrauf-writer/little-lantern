  /* ── useInView ─────────────────────────────────────────────── */
  function useInView(options = {}) {
    const ref = React.useRef(null);
    const [vis, setVis] = React.useState(false);
    React.useEffect(() => {
      if (!ref.current) return;
      const obs = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { setVis(true); obs.disconnect(); }
      }, { threshold: 0.1, ...options });
      obs.observe(ref.current);
      return () => obs.disconnect();
    }, []);
    return [ref, vis];
  }

  function FadeUp({ children, delay = 0, style: s, className = '' }) {
    const [ref, vis] = useInView();
    return (
      <div ref={ref} className={`fade-up${vis?' visible':''} ${delay?`delay-${delay}`:''} ${className}`} style={s}>
        {children}
      </div>
    );
  }

      <section style={{ background:'var(--color-cream)', padding:'104px 40px' }}>
        <div style={{ maxWidth:'680px', margin:'0 auto' }}>
          <FadeUp>
            <div style={{ textAlign:'center', marginBottom:'56px' }}>
              <SectionLabel>Make a Difference</SectionLabel>
              <h2 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(30px, 4vw, 58px)',
                fontWeight:400, fontStyle:'italic', color:'var(--color-charcoal)', lineHeight:1.15, marginBottom:'16px' }}>
                Your gift changes lives
              </h2>
              <p style={{ fontFamily:'var(--font-body)', fontSize:'15px', color:'var(--color-charcoal-60)',
                lineHeight:1.75, maxWidth:'500px', margin:'0 auto' }}>
                Every contribution helps us deliver therapy, resources, and community to autistic children around the world.
              </p>
            </div>
          </FadeUp>
          <FadeUp delay={1}>
            <div style={{ background:'#fff', borderRadius:'28px', boxShadow:'var(--shadow-lg)', padding:'48px' }}>
              {/* Frequency pills */}
              <div style={{ display:'flex', background:'var(--color-cream-mid)', borderRadius:'9999px',
                padding:'4px', marginBottom:'36px', width:'fit-content' }}>
                {['monthly','once'].map(f => (
                  <button key={f} onClick={()=>setFreq(f)} style={{
                    padding:'10px 26px', borderRadius:'9999px', border:'none',
                    background: freq===f ? '#fff' : 'transparent',
                    boxShadow: freq===f ? 'var(--shadow-xs)' : 'none',
                    fontFamily:'var(--font-body)', fontSize:'12px', fontWeight:700,
                    letterSpacing:'0.08em', textTransform:'uppercase',
                    color: freq===f ? 'var(--color-teal)' : 'var(--color-charcoal-60)',
                    cursor:'pointer', transition:'all 200ms ease',
                  }}>{f==='monthly'?'Monthly Gift':'One-Time Gift'}</button>
                ))}
              </div>

              <div style={{ fontFamily:'var(--font-body)', fontSize:'9px', fontWeight:700,
                letterSpacing:'0.2em', textTransform:'uppercase', color:'var(--color-charcoal-60)', marginBottom:'12px' }}>
                Choose an Amount
              </div>
              <div className="donate-amounts" style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:'10px', marginBottom:'20px' }}>
                {amounts.map(a => (
                  <button key={a} onClick={()=>{setSel(a);setCustom('');}} style={{
                    padding:'14px 8px', borderRadius:'12px', border:'2px solid',
                    borderColor: sel===a&&!custom ? 'var(--color-gold)' : 'rgba(200,166,74,0.22)',
                    background: sel===a&&!custom ? 'var(--color-gold)' : 'rgba(200,166,74,0.04)',
                    color: sel===a&&!custom ? '#fff' : 'var(--color-gold-dark)',
                    fontFamily:'var(--font-body)', fontSize:'18px', fontWeight:700,
                    transition:'all 200ms ease',
                  }}>${a}</button>
                ))}
                <input placeholder="Other" value={custom} type="number"
                  onChange={e=>{setCustom(e.target.value);setSel(null);}}
                  style={{ padding:'14px 8px', borderRadius:'12px', border:`2px solid ${custom?'var(--color-gold)':'rgba(200,166,74,0.22)'}`,
                    fontFamily:'var(--font-body)', fontSize:'16px', fontWeight:700,
                    color:'var(--color-gold-dark)', background:'rgba(200,166,74,0.04)',
                    outline:'none', textAlign:'center' }} />
              </div>

              {/* Impact line */}
              {impact[sel] && !custom && (
                <div style={{ display:'flex', alignItems:'center', gap:'10px',
                  background:'rgba(26,122,107,0.06)', borderRadius:'12px',
                  padding:'13px 18px', marginBottom:'28px' }}>
                  <span style={{ color:'var(--color-teal)', fontSize:'14px', flexShrink:0 }}>✦</span>
                  <span style={{ fontFamily:'var(--font-body)', fontSize:'13px',
                    color:'var(--color-teal)', fontStyle:'italic' }}>{impact[sel]}</span>
                </div>
              )}

              {Button && (
                <Button variant="donate" size="lg" fullWidth>
                  {freq==='monthly' ? `Give ${display} Every Month` : `Donate ${display} Today`}
                </Button>
              )}
              <p style={{ fontFamily:'var(--font-body)', fontSize:'11px', color:'var(--color-charcoal-30)',
                textAlign:'center', marginTop:'16px', letterSpacing:'0.06em' }}>
                Secure payment · Tax-deductible · Cancel anytime
              </p>
            </div>
          </FadeUp>
        </div>
      </section>
    );
  }

  /* ═══════════════════════════════════════════════════════════ */
  function News() {

        desc:'Join our global awareness walk and light-it-up campaign. Events in 23 cities worldwide.' },

      { accent:'var(--color-mint)', badge:'mint', cat:'Programme',
        date:'May 20, 2025',
        title:'New Intervention Hub Opens in Nairobi',
        desc:'Expanding our reach into East Africa — 200 more families gaining access to our core programme.' },
    ];
    return (
      <section style={{ background:'var(--color-cream-mid)', padding:'104px 40px' }}>
        <div style={{ maxWidth:'1200px', margin:'0 auto' }}>

            <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between',
              marginBottom:'60px', gap:'16px', flexWrap:'wrap' }}>
              <div>
                <SectionLabel>News &amp; Events</SectionLabel>
                <h2 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(28px, 3vw, 46px)',
                  fontWeight:400, color:'var(--color-charcoal)', lineHeight:1.2 }}>What's happening</h2>
              </div>
              {Button && <Button variant="secondary" size="sm">See All</Button>}
            </div>
          </FadeUp>
          <div className="news-grid" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'24px' }}>
            {items.map((item, i) => (
              <FadeUp key={i} delay={i+1}>
                <div style={{ background:'#fff', borderRadius:'20px', boxShadow:'var(--shadow-sm)',
                  overflow:'hidden', display:'flex', flexDirection:'column', height:'100%',
                  border:'1px solid rgba(26,122,107,0.06)',
                  transition:'box-shadow 250ms ease, transform 250ms ease', cursor:'pointer' }}
                  onMouseEnter={e=>{e.currentTarget.style.boxShadow='var(--shadow-lg)';e.currentTarget.style.transform='translateY(-4px)';}}
                  onMouseLeave={e=>{e.currentTarget.style.boxShadow='var(--shadow-sm)';e.currentTarget.style.transform='';}}>
                  <div style={{ height:'6px', background:item.accent }} />
                  <div style={{ padding:'28px 28px 32px', flex:1, display:'flex', flexDirection:'column', gap:'14px' }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px' }}>
                      {Badge && <Badge variant={item.badge} size="sm">{item.cat}</Badge>}
                      <span style={{ fontFamily:'var(--font-body)', fontSize:'11px', color:'var(--color-charcoal-30)', flexShrink:0 }}>{item.date}</span>
                    </div>
                    <h3 style={{ fontFamily:'var(--font-body)', fontSize:'17px', fontWeight:700,
                      color:'var(--color-charcoal)', lineHeight:1.3 }}>{item.title}</h3>
                    <p style={{ fontFamily:'var(--font-body)', fontSize:'13px', color:'var(--color-charcoal-60)',
                      lineHeight:1.68, flex:1 }}>{item.desc}</p>
                    <span style={{ fontFamily:'var(--font-body)', fontSize:'11px', fontWeight:700,
                      letterSpacing:'0.1em', textTransform:'uppercase', color:item.accent, marginTop:'4px' }}>Read More →</span>
                  </div>
                </div>
              </FadeUp>
            ))}
          </div>
        </div>
      </section>
    );
  }

  /* ═══════════════════════════════════════════════════════════ */
  /* NEWSLETTER                                                  */
  /* ═══════════════════════════════════════════════════════════ */
  function Newsletter() {
    const [email, setEmail]   = React.useState('');
    const [done, setDone]     = React.useState(false);
    return (
      <section style={{ background:'var(--color-teal)', padding:'96px 40px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', right:'-60px', bottom:'-60px', width:'320px', height:'320px',
          borderRadius:'50%', background:'rgba(184,216,208,0.12)', pointerEvents:'none' }} />
        <div style={{ maxWidth:'620px', margin:'0 auto', textAlign:'center', position:'relative' }}>
          <FadeUp>
            <div style={{ fontFamily:'var(--font-body)', fontSize:'10px', fontWeight:700,
              letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(255,255,255,0.45)', marginBottom:'14px' }}>
              Stay Connected
            </div>
            <h2 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(26px, 3.5vw, 46px)',
              fontWeight:400, fontStyle:'italic', color:'#ffffff', lineHeight:1.25, marginBottom:'16px' }}>
              Stories of hope,<br/>delivered to your inbox
            </h2>
            <p style={{ fontFamily:'var(--font-body)', fontSize:'14px', color:'rgba(255,255,255,0.62)',
              lineHeight:1.78, marginBottom:'40px' }}>
              Programme updates, awareness campaigns, and family stories — never more than twice a month. Unsubscribe any time.
            </p>
          </FadeUp>
          <FadeUp delay={1}>
            {!done ? (
              <div style={{ display:'flex', gap:'10px', maxWidth:'480px', margin:'0 auto 16px', flexWrap:'wrap' }}>
                <input type="email" placeholder="Your email address" value={email}
                  onChange={e=>setEmail(e.target.value)}
                  style={{ flex:'1 1 200px', padding:'14px 22px', borderRadius:'9999px',
                    border:'2px solid rgba(255,255,255,0.2)', background:'rgba(255,255,255,0.1)',
                    fontFamily:'var(--font-body)', fontSize:'14px', color:'#fff',
                    outline:'none', transition:'border-color 150ms ease' }}
                  onFocus={e=>e.target.style.borderColor='rgba(255,255,255,0.5)'}
                  onBlur={e=>e.target.style.borderColor='rgba(255,255,255,0.2)'}
                />
                {Button && <Button variant="on-dark" size="md" onClick={()=>email&&setDone(true)}>
                  Subscribe
                </Button>}
              </div>
            ) : (
              <div style={{ fontFamily:'var(--font-display)', fontSize:'24px', fontStyle:'italic',
                color:'var(--color-gold)', marginBottom:'16px' }}>
                Thank you for joining our community ✦
              </div>
            )}
            <p style={{ fontFamily:'var(--font-body)', fontSize:'11px',
              color:'rgba(255,255,255,0.3)', letterSpacing:'0.08em' }}>
              No spam · Unsubscribe any time
            </p>
          </FadeUp>
        </div>
      </section>
    );
  }
